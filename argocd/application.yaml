apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-app
spec:
  source:
    repoURL: https://github.com/bdv1234/order-mgt-gitops
    targetRevision: main
    path: apps/order-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  project: default
  syncPolicy:
    automated:
      enabled: false
      prune: true
      selfHeal: true
